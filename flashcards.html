<style>
:root{--bg:#F6F7F9;--surface:#FFFFFF;--ink:#1B1F27;--muted:#5E6775;--accent:#1F4E9C;--accent-soft:#E8EEF9;--amber:#A66A12;--amber-soft:#FBF2E0;--green:#2E7D4F;--rule:#D8DDE5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161B;--surface:#1B1F26;--ink:#E7EAF0;--muted:#9AA4B3;--accent:#8AB0EC;--accent-soft:#1E2A40;--amber:#E2A64C;--amber-soft:#2E2414;--green:#6CC28F;--rule:#2A303A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161B;--surface:#1B1F26;--ink:#E7EAF0;--muted:#9AA4B3;--accent:#8AB0EC;--accent-soft:#1E2A40;--amber:#E2A64C;--amber-soft:#2E2414;--green:#6CC28F;--rule:#2A303A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.55}
.page{max-width:720px;margin:0 auto;padding:40px 16px 80px}
.eyebrow{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.eyebrow a{color:var(--muted)}
h1{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:700;font-size:clamp(28px,6vw,36px);line-height:1.1;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 20px;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
button{font:600 14px "IBM Plex Sans",system-ui,sans-serif;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;border-radius:0}
button:hover{background:var(--accent-soft)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.bar{height:6px;background:var(--rule);margin:0 0 8px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--accent);min-height:260px;padding:28px 22px 22px;cursor:pointer;position:relative;outline:none}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.flipped{border-left-color:var(--green)}
.tagline{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.tagline .k{color:var(--accent)}
.tagline .k.Trap{color:var(--amber)}
.front{font-size:19px}
.back{display:none;border-top:1px dashed var(--rule);margin-top:18px;padding-top:16px}
.card.flipped .back{display:block}
.hint{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;color:var(--muted);margin-top:18px}
.card.flipped .hint{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.actions button{padding:14px;font-size:15px}
#again{border-color:var(--amber);color:var(--amber)}
#got{border-color:var(--green);color:var(--green)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tools button{font-size:13px;padding:6px 12px;color:var(--muted)}
.done{text-align:center;padding:40px 10px}
.done h2{font-family:"IBM Plex Sans",system-ui,sans-serif;margin:0 0 8px}
mjx-container[jax="SVG"]:not([display="true"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.keys{font-size:13px;color:var(--muted);margin-top:14px}
kbd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;border:1px solid var(--rule);padding:0 5px}

<p class="eyebrow"><a href="index.html">Math 54</a> · Midterm 2 · §4.1–6.5</p>
<h1>Flashcards</h1>
<p class="lede">Definitions, theorems by book number, recipes, and traps. Try to answer out loud before flipping. Cards you mark "Again" come back a few cards later and stay in the review pile until you get them.</p>
<div class="chips" role="group" aria-label="Deck">
  <button class="chip" data-deck="all" aria-pressed="true">All</button>
  <button class="chip" data-deck="4" aria-pressed="false">Ch. 4</button>
  <button class="chip" data-deck="5" aria-pressed="false">Ch. 5</button>
  <button class="chip" data-deck="6" aria-pressed="false">Ch. 6</button>
  <button class="chip" data-deck="review" aria-pressed="false">Review pile</button>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="meta"><span id="count"></span><span id="pile"></span></div>
<div id="stage"></div>
<div class="tools"><button id="shuffle">Shuffle &amp; restart</button><button id="reset">Clear review pile</button></div>
<p class="keys"><kbd>Space</kbd> flip · <kbd>1</kbd> again · <kbd>2</kbd> got it</p>

<script id="cards" type="application/json">[{"s": "4.1", "k": "Definition", "f": "What is a <b>subspace<\/b> $H$ of a vector space $V$? (3 conditions)", "b": "(a) $\\mathbf 0\\in H$; (b) closed under addition: $\\mathbf u,\\mathbf v\\in H\\Rightarrow\\mathbf u+\\mathbf v\\in H$; (c) closed under scalar multiples: $c\\mathbf u\\in H$.", "id": 0}, {"s": "4.1", "k": "Theorem", "f": "Thm 1 · §4.1: what is $\\operatorname{Span}\\{\\mathbf v_1,\\dots,\\mathbf v_p\\}$ always?", "b": "A subspace of $V$ (the subspace <em>spanned<\/em> by the $\\mathbf v$'s). Fastest way to prove a set is a subspace: write it as a span.", "id": 1}, {"s": "4.1", "k": "Trap", "f": "Is $\\mathbb R^2$ a subspace of $\\mathbb R^3$?", "b": "No: $\\mathbb R^2$ isn't even a subset of $\\mathbb R^3$. The plane $\\{(x,y,0)\\}$ is a subspace that <em>looks like<\/em> $\\mathbb R^2$.", "id": 2}, {"s": "4.1", "k": "Fact", "f": "Quickest way to show a set is <b>not<\/b> a subspace?", "b": "Check whether $\\mathbf 0$ is in it. If it is, find a specific counterexample to closure under addition or scaling (e.g. a line not through 0, $\\det=0$ matrices).", "id": 3}, {"s": "4.2", "k": "Definition", "f": "$\\operatorname{Nul}A$ for $A$ $m\\times n$: definition, and which $\\mathbb R^k$ it lives in.", "b": "$\\{\\mathbf x:A\\mathbf x=\\mathbf 0\\}$, a subspace of $\\mathbb R^n$ (the number of <b>columns<\/b>). Implicit: you must solve to list vectors, but checking membership is easy.", "id": 4}, {"s": "4.2", "k": "Definition", "f": "$\\operatorname{Col}A$: definition, and which $\\mathbb R^k$ it lives in.", "b": "Span of the columns $=\\{A\\mathbf x\\}=\\{\\mathbf b: A\\mathbf x=\\mathbf b$ consistent$\\}$. A subspace of $\\mathbb R^m$ (the number of <b>rows<\/b>). Explicit: easy to list vectors, harder to test membership.", "id": 5}, {"s": "4.2", "k": "Fact", "f": "$\\operatorname{Col}A=\\mathbb R^m$ is equivalent to…?", "b": "$A\\mathbf x=\\mathbf b$ has a solution for every $\\mathbf b$ ⇔ a pivot in every row ⇔ $\\mathbf x\\mapsto A\\mathbf x$ is onto.", "id": 6}, {"s": "4.2", "k": "Definition", "f": "Kernel and range of a linear transformation $T:V\\to W$.", "b": "Kernel $=\\{\\mathbf u\\in V:T(\\mathbf u)=\\mathbf 0\\}$ (subspace of $V$). Range $=\\{T(\\mathbf x)\\}$ (subspace of $W$). For $T(\\mathbf x)=A\\mathbf x$: kernel $=\\operatorname{Nul}A$, range $=\\operatorname{Col}A$.", "id": 7}, {"s": "4.2", "k": "Recipe", "f": "Basis for Nul A?", "b": "Row reduce to <b>RREF<\/b>, solve for the basic variables, write $\\mathbf x$ = combination of free variables. The vectors multiplying the free variables form the basis. Count = number of free variables.", "id": 8}, {"s": "4.2", "k": "Trap", "f": "Row operations preserve which of Nul A, Col A, Row A?", "b": "Nul A and Row A are preserved. <b>Col A changes<\/b>, so take Col basis vectors from the <b>original<\/b> A.", "id": 9}, {"s": "4.3", "k": "Definition", "f": "<b>Basis<\/b> of a subspace $H$.", "b": "A set $\\mathcal B$ in $H$ that is (1) linearly independent and (2) spans $H$. The smallest spanning set, and the largest independent set.", "id": 10}, {"s": "4.3", "k": "Theorem", "f": "Thm 5 · §4.3: Spanning Set Theorem.", "b": "If $\\mathbf v_k$ is a combination of the others, removing it doesn't change the span. If $H\\neq\\{\\mathbf 0\\}$, some subset of the spanning set is a basis.", "id": 11}, {"s": "4.3", "k": "Theorem", "f": "Thm 6 · §4.3: basis for Col A?", "b": "The <b>pivot columns of A<\/b> (the original A, not its echelon form).", "id": 12}, {"s": "4.3", "k": "Recipe", "f": "Basis for Row A?", "b": "The nonzero rows of an <b>echelon form<\/b> of A (not the original rows).", "id": 13}, {"s": "4.3", "k": "Theorem", "f": "Thm 4 · §4.3: when is $\\{\\mathbf v_1,\\dots,\\mathbf v_p\\}$ (with $\\mathbf v_1\\neq\\mathbf 0$) dependent?", "b": "Iff some $\\mathbf v_j$ ($j&gt;1$) is a linear combination of the vectors before it.", "id": 14}, {"s": "4.4", "k": "Theorem", "f": "Thm 8 · §4.4: Unique Representation Theorem.", "b": "If $\\mathcal B$ is a basis of $V$, each $\\mathbf x\\in V$ is $c_1\\mathbf b_1+\\cdots+c_n\\mathbf b_n$ for exactly one list of weights. $[\\mathbf x]_{\\mathcal B}=(c_1,\\dots,c_n)$.", "id": 15}, {"s": "4.4", "k": "Recipe", "f": "Find $[\\mathbf x]_{\\mathcal B}$ in $\\mathbb R^n$; and find $\\mathbf x$ from $[\\mathbf x]_{\\mathcal B}$.", "b": "$\\mathbf x=P_{\\mathcal B}[\\mathbf x]_{\\mathcal B}$ with $P_{\\mathcal B}=[\\mathbf b_1\\cdots\\mathbf b_n]$. To get coordinates, solve $P_{\\mathcal B}\\mathbf c=\\mathbf x$ (row reduce $[P_{\\mathcal B}\\mid\\mathbf x]$).", "id": 16}, {"s": "4.4", "k": "Theorem", "f": "Thm 9 · §4.4: what does the coordinate mapping $\\mathbf x\\mapsto[\\mathbf x]_{\\mathcal B}$ do?", "b": "It's a one-to-one linear map from $V$ <b>onto<\/b> $\\mathbb R^n$ (an <b>isomorphism<\/b>). So a question about polynomials or matrices can be answered with coordinate vectors.", "id": 17}, {"s": "4.4", "k": "Trap", "f": "$H$ is a 2-dimensional plane in $\\mathbb R^3$, $\\mathbf x\\in H$. How many entries does $[\\mathbf x]_{\\mathcal B}$ have?", "b": "2, one per basis vector, not 3.", "id": 18}, {"s": "4.5", "k": "Definition", "f": "Dimension of $V$.", "b": "The number of vectors in any basis. $\\dim\\{\\mathbf 0\\}=0$. $\\dim\\mathbb P_n=n+1$, $\\dim M_{m\\times n}=mn$.", "id": 19}, {"s": "4.5", "k": "Theorem", "f": "Thm 10 · §4.5: if $V$ has a basis of $n$ vectors, what about a set of more than $n$ vectors?", "b": "It must be linearly dependent. (Thm 11: every basis has exactly $n$ vectors.)", "id": 20}, {"s": "4.5", "k": "Theorem", "f": "Thm 13 · §4.5: Basis Theorem.", "b": "In a $p$-dimensional space ($p\\ge1$): any $p$ <b>independent<\/b> vectors form a basis, and any $p$ vectors that <b>span<\/b> form a basis. If you have the right count, you only need to check one condition.", "id": 21}, {"s": "4.5", "k": "Fact", "f": "$\\dim\\operatorname{Nul}A$ and $\\dim\\operatorname{Col}A$ in terms of pivots.", "b": "$\\dim\\operatorname{Nul}A$ = number of free variables; $\\dim\\operatorname{Col}A$ = number of pivot columns = rank.", "id": 22}, {"s": "4.5", "k": "Theorem", "f": "Thm 14 · §4.5: Rank Theorem.", "b": "$\\operatorname{rank}A+\\dim\\operatorname{Nul}A=n$ (number of columns). Also $\\dim\\operatorname{Col}A=\\dim\\operatorname{Row}A=\\operatorname{rank}A=\\operatorname{rank}A^T$.", "id": 23}, {"s": "4.5", "k": "Fact", "f": "IMT additions from §4.5 ($A$ is $n\\times n$).", "b": "Invertible ⇔ columns form a basis of $\\mathbb R^n$ ⇔ $\\operatorname{Col}A=\\mathbb R^n$ ⇔ rank $n$ ⇔ $\\dim\\operatorname{Nul}A=0$ ⇔ $\\operatorname{Nul}A=\\{\\mathbf 0\\}$.", "id": 24}, {"s": "4.5", "k": "Trap", "f": "Can a $6\\times9$ matrix have $\\dim\\operatorname{Nul}A=2$?", "b": "No: rank would be $9-2=7$, but the rank is at most 6 (number of rows).", "id": 25}, {"s": "4.6", "k": "Definition", "f": "Columns of $\\underset{\\mathcal C\\leftarrow\\mathcal B}{P}$?", "b": "$[\\mathbf b_1]_{\\mathcal C},\\dots,[\\mathbf b_n]_{\\mathcal C}$: the <b>old<\/b> basis vectors written in the <b>new<\/b> basis. Then $[\\mathbf x]_{\\mathcal C}=\\underset{\\mathcal C\\leftarrow\\mathcal B}{P}[\\mathbf x]_{\\mathcal B}$.", "id": 26}, {"s": "4.6", "k": "Recipe", "f": "Compute $\\underset{\\mathcal C\\leftarrow\\mathcal B}{P}$ in $\\mathbb R^n$.", "b": "Row reduce $[\\,\\mathbf c_1\\cdots\\mathbf c_n\\mid\\mathbf b_1\\cdots\\mathbf b_n\\,]\\sim[\\,I\\mid\\underset{\\mathcal C\\leftarrow\\mathcal B}{P}\\,]$. Memory aid: the basis you're going <b>to<\/b> (C) goes on the left.", "id": 27}, {"s": "4.6", "k": "Fact", "f": "$\\big(\\underset{\\mathcal C\\leftarrow\\mathcal B}{P}\\big)^{-1}=$ ?  And $P_{\\mathcal B}$ is which change-of-basis matrix?", "b": "$\\underset{\\mathcal B\\leftarrow\\mathcal C}{P}$. And $P_{\\mathcal B}=\\underset{\\mathcal E\\leftarrow\\mathcal B}{P}$ (from $\\mathcal B$ to the standard basis).", "id": 28}, {"s": "5.1", "k": "Definition", "f": "Eigenvector and eigenvalue of $A$.", "b": "$\\mathbf x\\neq\\mathbf 0$ with $A\\mathbf x=\\lambda\\mathbf x$. $A$ only stretches/flips $\\mathbf x$ along its own line. $\\lambda$ may be 0; $\\mathbf x$ may <b>not<\/b> be $\\mathbf 0$.", "id": 29}, {"s": "5.1", "k": "Recipe", "f": "Check whether $\\lambda$ is an eigenvalue; find its eigenspace.", "b": "$\\lambda$ is an eigenvalue ⇔ $(A-\\lambda I)\\mathbf x=\\mathbf 0$ has a nontrivial solution (a free variable). Eigenspace $=\\operatorname{Nul}(A-\\lambda I)$.", "id": 30}, {"s": "5.1", "k": "Recipe", "f": "Check whether a given $\\mathbf v$ is an eigenvector.", "b": "Compute $A\\mathbf v$ and see if it's a multiple of $\\mathbf v$. The multiple is $\\lambda$.", "id": 31}, {"s": "5.1", "k": "Theorem", "f": "Thm 1 · §5.1: eigenvalues of a triangular matrix.", "b": "The entries on its main diagonal.", "id": 32}, {"s": "5.1", "k": "Fact", "f": "0 is an eigenvalue of $A$ ⇔ ?", "b": "$A$ is <b>not<\/b> invertible ($A\\mathbf x=\\mathbf 0$ has a nontrivial solution).", "id": 33}, {"s": "5.1", "k": "Theorem", "f": "Thm 2 · §5.1: eigenvectors for distinct eigenvalues.", "b": "If $\\mathbf v_1,\\dots,\\mathbf v_r$ correspond to distinct $\\lambda_1,\\dots,\\lambda_r$, then the set is linearly independent.", "id": 34}, {"s": "5.1", "k": "Trap", "f": "Does row reduction preserve eigenvalues?", "b": "No. Row-equivalent matrices usually have different eigenvalues. (Similar matrices share them.)", "id": 35}, {"s": "5.2", "k": "Definition", "f": "Characteristic equation.", "b": "$\\det(A-\\lambda I)=0$. Its roots are the eigenvalues; a root's multiplicity is its <b>algebraic multiplicity<\/b>.", "id": 36}, {"s": "5.2", "k": "Fact", "f": "$2\\times2$ shortcut for the characteristic polynomial.", "b": "$\\lambda^2-(\\operatorname{tr}A)\\lambda+\\det A$. Product of eigenvalues $=\\det A$, sum $=$ trace.", "id": 37}, {"s": "5.2", "k": "Definition", "f": "$A$ and $B$ are <b>similar<\/b> when…? What do they share?", "b": "$B=P^{-1}AP$ for some invertible $P$. They share the characteristic polynomial, so the same eigenvalues with the same multiplicities (Thm 4), plus det, rank, trace.", "id": 38}, {"s": "5.2", "k": "Trap", "f": "Same eigenvalues ⇒ similar?", "b": "No. $\\left[\\begin{smallmatrix}2&1\\\\0&2\\end{smallmatrix}\\right]$ and $2I$ have the same eigenvalues but aren't similar. Similarity is also not the same as row equivalence.", "id": 39}, {"s": "5.2", "k": "Fact", "f": "$\\det A$ in terms of eigenvalues; $\\det(cA)$ for $n\\times n$.", "b": "$\\det A=\\lambda_1\\cdots\\lambda_n$ (with multiplicity). $\\det(cA)=c^n\\det A$.", "id": 40}, {"s": "5.3", "k": "Definition", "f": "$A$ is <b>diagonalizable<\/b> means…", "b": "$A=PDP^{-1}$ with $D$ diagonal. Then $A^k=PD^kP^{-1}$.", "id": 41}, {"s": "5.3", "k": "Theorem", "f": "Thm 5 · §5.3: Diagonalization Theorem.", "b": "$n\\times n$ $A$ is diagonalizable ⇔ it has $n$ linearly independent eigenvectors. Then the columns of $P$ are those eigenvectors and $D$ holds the matching eigenvalues <b>in the same order<\/b>.", "id": 42}, {"s": "5.3", "k": "Theorem", "f": "Thm 6 · §5.3: a sufficient condition for diagonalizability.", "b": "$n$ <b>distinct<\/b> eigenvalues ⇒ diagonalizable. (Not necessary: $I$ is diagonalizable with one repeated eigenvalue.)", "id": 43}, {"s": "5.3", "k": "Theorem", "f": "Thm 7 · §5.3: test with repeated eigenvalues.", "b": "Each eigenspace has dimension ≤ the algebraic multiplicity. $A$ is diagonalizable ⇔ the eigenspace dimensions add up to $n$ ⇔ each eigenspace's dimension equals its multiplicity.", "id": 44}, {"s": "5.3", "k": "Recipe", "f": "Diagonalize $A$: four steps.", "b": "1. Eigenvalues. 2. A basis for each eigenspace. 3. Count: need $n$ vectors total, otherwise stop (not diagonalizable). 4. $P$ = eigenvectors, $D$ = eigenvalues in the same order. Check $AP=PD$.", "id": 45}, {"s": "5.3", "k": "Trap", "f": "Diagonalizable vs invertible: does either imply the other?", "b": "No. $\\operatorname{diag}(0,1)$ is diagonalizable but not invertible; $\\left[\\begin{smallmatrix}1&1\\\\0&1\\end{smallmatrix}\\right]$ is invertible but not diagonalizable.", "id": 46}, {"s": "5.4", "k": "Definition", "f": "$\\mathcal B$-matrix $[T]_{\\mathcal B}$ of $T:V\\to V$.", "b": "Columns $[T(\\mathbf b_1)]_{\\mathcal B},\\dots,[T(\\mathbf b_n)]_{\\mathcal B}$. Satisfies $[T(\\mathbf x)]_{\\mathcal B}=[T]_{\\mathcal B}[\\mathbf x]_{\\mathcal B}$.", "id": 47}, {"s": "5.4", "k": "Fact", "f": "$T(\\mathbf x)=A\\mathbf x$ on $\\mathbb R^n$ and a basis $\\mathcal B$ (columns of $P$): $[T]_{\\mathcal B}=$ ?", "b": "$P^{-1}AP$. (Not $PAP^{-1}$.)", "id": 48}, {"s": "5.4", "k": "Theorem", "f": "Thm 8 · §5.4: Diagonal Matrix Representation.", "b": "If $A=PDP^{-1}$, then $D$ is the $\\mathcal B$-matrix of $\\mathbf x\\mapsto A\\mathbf x$, where $\\mathcal B$ = columns of $P$. In the eigenvector basis, the map just scales each axis.", "id": 49}, {"s": "5.4", "k": "Recipe", "f": "Matrix of $T:\\mathbb P_2\\to\\mathbb P_2$ in $\\{1,t,t^2\\}$.", "b": "Apply $T$ to $1$, $t$, $t^2$ one at a time; write each result's coefficients as a column.", "id": 50}, {"s": "5.5", "k": "Fact", "f": "Complex eigenvalues of a <b>real<\/b> matrix come in…?", "b": "Conjugate pairs: if $A\\mathbf x=\\lambda\\mathbf x$ then $A\\bar{\\mathbf x}=\\bar\\lambda\\bar{\\mathbf x}$. So a real $n\\times n$ matrix with odd $n$ always has a real eigenvalue.", "id": 51}, {"s": "5.5", "k": "Recipe", "f": "Fast eigenvector for $\\lambda$ (2×2, complex).", "b": "Use <b>one<\/b> row of $A-\\lambda I$, say $[\\,p\\ \\ q\\,]$. Then $\\mathbf v=(-q,\\ p)$. The other row is automatically a multiple of it.", "id": 52}, {"s": "5.5", "k": "Fact", "f": "$C=\\left[\\begin{smallmatrix}a&-b\\\\b&a\\end{smallmatrix}\\right]$: eigenvalues, $r$, $\\varphi$, geometric meaning.", "b": "$a\\pm bi$. $r=\\sqrt{a^2+b^2}=|\\lambda|$, $\\varphi$ = angle of the point $(a,b)$. $C$ = rotate by $\\varphi$ then scale by $r$.", "id": 53}, {"s": "5.5", "k": "Theorem", "f": "Thm 9 · §5.5: real 2×2 $A$ with eigenvalue $a-bi$, eigenvector $\\mathbf v$.", "b": "$A=PCP^{-1}$, $P=[\\operatorname{Re}\\mathbf v\\ \\ \\operatorname{Im}\\mathbf v]$, $C=\\left[\\begin{smallmatrix}a&-b\\\\b&a\\end{smallmatrix}\\right]$. Use the eigenvalue with the <b>minus<\/b> sign.", "id": 54}, {"s": "5.5", "k": "Fact", "f": "Long-run behavior of $A^k\\mathbf x$ for complex eigenvalues with $|\\lambda|=r$.", "b": "$r&lt;1$: spiral in to 0. $r=1$: stay on an ellipse. $r&gt;1$: spiral out. (An ellipse in general, not a circle.)", "id": 55}, {"s": "6.1", "k": "Definition", "f": "Length, unit vector, distance.", "b": "$\\|\\mathbf v\\|=\\sqrt{\\mathbf v\\cdot\\mathbf v}$. Unit vector: $\\mathbf v/\\|\\mathbf v\\|$. $\\operatorname{dist}(\\mathbf u,\\mathbf v)=\\|\\mathbf u-\\mathbf v\\|$.", "id": 56}, {"s": "6.1", "k": "Theorem", "f": "Thm 2 · §6.1: Pythagorean Theorem.", "b": "$\\mathbf u\\perp\\mathbf v$ ⇔ $\\|\\mathbf u+\\mathbf v\\|^2=\\|\\mathbf u\\|^2+\\|\\mathbf v\\|^2$. (Comes from $\\|\\mathbf u+\\mathbf v\\|^2=\\|\\mathbf u\\|^2+2\\mathbf u\\cdot\\mathbf v+\\|\\mathbf v\\|^2$.)", "id": 57}, {"s": "6.1", "k": "Definition", "f": "$W^\\perp$, and the shortcut for checking membership.", "b": "All vectors orthogonal to every vector in $W$. It's enough to be orthogonal to each vector in a <b>spanning set<\/b>. $W^\\perp$ is a subspace, and $\\dim W+\\dim W^\\perp=n$.", "id": 58}, {"s": "6.1", "k": "Theorem", "f": "Thm 3 · §6.1: the four fundamental subspaces.", "b": "$(\\operatorname{Row}A)^\\perp=\\operatorname{Nul}A$ and $(\\operatorname{Col}A)^\\perp=\\operatorname{Nul}A^T$.", "id": 59}, {"s": "6.1", "k": "Recipe", "f": "Find a basis for $W^\\perp$ given $W=\\operatorname{Span}\\{\\mathbf w_1,\\dots,\\mathbf w_p\\}$.", "b": "Put the $\\mathbf w$'s in as <b>rows<\/b> of a matrix and find its null space.", "id": 60}, {"s": "6.1", "k": "Fact", "f": "$\\mathbf u\\cdot\\mathbf v$ and the angle between them.", "b": "$\\mathbf u\\cdot\\mathbf v=\\|\\mathbf u\\|\\|\\mathbf v\\|\\cos\\vartheta$. Positive: acute; 0: right angle; negative: obtuse.", "id": 61}, {"s": "6.1", "k": "Trap", "f": "$\\mathbf u\\perp\\mathbf v$ and $\\mathbf v\\perp\\mathbf w$. Is $\\mathbf u\\perp\\mathbf w$?", "b": "Not necessarily: $\\mathbf u=\\mathbf w=(1,0)$, $\\mathbf v=(0,1)$.", "id": 62}, {"s": "6.2", "k": "Theorem", "f": "Thm 4 · §6.2: orthogonal sets and independence.", "b": "An orthogonal set of <b>nonzero<\/b> vectors is linearly independent, so it's a basis for its span.", "id": 63}, {"s": "6.2", "k": "Theorem", "f": "Thm 5 · §6.2: weights in an orthogonal basis.", "b": "$\\mathbf y=\\sum c_j\\mathbf u_j$ with $c_j=\\dfrac{\\mathbf y\\cdot\\mathbf u_j}{\\mathbf u_j\\cdot\\mathbf u_j}$. No row reduction needed.", "id": 64}, {"s": "6.2", "k": "Definition", "f": "Projection of $\\mathbf y$ onto the line through $\\mathbf u$.", "b": "$\\hat{\\mathbf y}=\\dfrac{\\mathbf y\\cdot\\mathbf u}{\\mathbf u\\cdot\\mathbf u}\\mathbf u$. Leftover $\\mathbf z=\\mathbf y-\\hat{\\mathbf y}\\perp\\mathbf u$. Distance to the line $=\\|\\mathbf y-\\hat{\\mathbf y}\\|$.", "id": 65}, {"s": "6.2", "k": "Theorem", "f": "Thm 6 & 7 · §6.2: orthonormal columns.", "b": "$U$ has orthonormal columns ⇔ $U^TU=I$. Then $\\|U\\mathbf x\\|=\\|\\mathbf x\\|$ and $(U\\mathbf x)\\cdot(U\\mathbf y)=\\mathbf x\\cdot\\mathbf y$ (lengths and angles are preserved).", "id": 66}, {"s": "6.2", "k": "Definition", "f": "Orthogonal <b>matrix<\/b>.", "b": "A <b>square<\/b> matrix with orthonormal columns: $U^{-1}=U^T$. Its rows are orthonormal too. (Despite the name, the columns must be orthonormal, not just orthogonal.)", "id": 67}, {"s": "6.2", "k": "Fact", "f": "Reflection of $\\mathbf y$ across the line $L$.", "b": "$2\\operatorname{proj}_L\\mathbf y-\\mathbf y$.", "id": 68}, {"s": "6.3", "k": "Theorem", "f": "Thm 8 · §6.3: Orthogonal Decomposition Theorem.", "b": "Each $\\mathbf y$ is uniquely $\\hat{\\mathbf y}+\\mathbf z$ with $\\hat{\\mathbf y}\\in W$, $\\mathbf z\\in W^\\perp$. With an <b>orthogonal<\/b> basis of $W$: $\\hat{\\mathbf y}=\\sum\\dfrac{\\mathbf y\\cdot\\mathbf u_j}{\\mathbf u_j\\cdot\\mathbf u_j}\\mathbf u_j$.", "id": 69}, {"s": "6.3", "k": "Theorem", "f": "Thm 9 · §6.3: Best Approximation Theorem.", "b": "$\\hat{\\mathbf y}=\\operatorname{proj}_W\\mathbf y$ is the closest point in $W$ to $\\mathbf y$: $\\|\\mathbf y-\\hat{\\mathbf y}\\|&lt;\\|\\mathbf y-\\mathbf v\\|$ for every other $\\mathbf v\\in W$. Distance to $W$ $=\\|\\mathbf y-\\hat{\\mathbf y}\\|$.", "id": 70}, {"s": "6.3", "k": "Theorem", "f": "Thm 10 · §6.3: projection with an orthonormal basis.", "b": "$\\operatorname{proj}_W\\mathbf y=\\sum(\\mathbf y\\cdot\\mathbf u_j)\\mathbf u_j=UU^T\\mathbf y$. ($U^TU=I_p$; $UU^T$ is the projection matrix.)", "id": 71}, {"s": "6.3", "k": "Trap", "f": "Can you use the projection formula with any basis of $W$?", "b": "No, only an <b>orthogonal<\/b> one. Check dot products first; otherwise use Gram–Schmidt (or the normal equations).", "id": 72}, {"s": "6.3", "k": "Fact", "f": "If $\\mathbf y\\in W$, then $\\operatorname{proj}_W\\mathbf y=$ ?  If $\\mathbf y\\in W^\\perp$?", "b": "$\\mathbf y$ itself. And $\\mathbf 0$.", "id": 73}, {"s": "6.3", "k": "Fact", "f": "Eigenvalues of a projection matrix $P$ onto $W$.", "b": "1 (eigenspace $W$) and 0 (eigenspace $W^\\perp$). $P^2=P$.", "id": 74}, {"s": "6.4", "k": "Theorem", "f": "Thm 11 · §6.4: Gram–Schmidt formula.", "b": "$\\mathbf v_1=\\mathbf x_1$, $\\ \\mathbf v_k=\\mathbf x_k-\\sum_{j&lt;k}\\dfrac{\\mathbf x_k\\cdot\\mathbf v_j}{\\mathbf v_j\\cdot\\mathbf v_j}\\mathbf v_j$. The span of the first $k$ stays the same at every step.", "id": 75}, {"s": "6.4", "k": "Recipe", "f": "Gram–Schmidt tips.", "b": "Project onto the <b>new<\/b> $\\mathbf v$'s. Scale freely to clear fractions. Check each new $\\mathbf v_k\\cdot\\mathbf v_j=0$. Normalize at the end. A $\\mathbf v_k=\\mathbf 0$ means $\\mathbf x_k$ was dependent on the earlier vectors.", "id": 76}, {"s": "6.4", "k": "Theorem", "f": "Thm 12 · §6.4: QR factorization.", "b": "$A$ ($m\\times n$, independent columns) $=QR$: $Q$ has orthonormal columns (a basis for Col A); $R$ is $n\\times n$ upper triangular, invertible, with positive diagonal. Compute $R=Q^TA$.", "id": 77}, {"s": "6.5", "k": "Definition", "f": "Least-squares solution of $A\\mathbf x=\\mathbf b$.", "b": "$\\hat{\\mathbf x}$ with $\\|\\mathbf b-A\\hat{\\mathbf x}\\|\\le\\|\\mathbf b-A\\mathbf x\\|$ for every $\\mathbf x$. Equivalently $A\\hat{\\mathbf x}=\\hat{\\mathbf b}=\\operatorname{proj}_{\\operatorname{Col}A}\\mathbf b$.", "id": 78}, {"s": "6.5", "k": "Theorem", "f": "Thm 13 · §6.5: the normal equations.", "b": "Least-squares solutions = solutions of $A^TA\\mathbf x=A^T\\mathbf b$. They always exist. Why: $\\mathbf b-A\\hat{\\mathbf x}\\perp\\operatorname{Col}A$ ⇔ $A^T(\\mathbf b-A\\hat{\\mathbf x})=\\mathbf 0$.", "id": 79}, {"s": "6.5", "k": "Theorem", "f": "Thm 14 · §6.5: when is the least-squares solution unique?", "b": "⇔ columns of $A$ independent ⇔ $A^TA$ invertible. Then $\\hat{\\mathbf x}=(A^TA)^{-1}A^T\\mathbf b$.", "id": 80}, {"s": "6.5", "k": "Theorem", "f": "Thm 15 · §6.5: least squares with $A=QR$.", "b": "$\\hat{\\mathbf x}=R^{-1}Q^T\\mathbf b$. In practice, solve $R\\hat{\\mathbf x}=Q^T\\mathbf b$ by back-substitution.", "id": 81}, {"s": "6.5", "k": "Fact", "f": "Least-squares error, and what error 0 means.", "b": "$\\|\\mathbf b-A\\hat{\\mathbf x}\\|$. Error 0 ⇔ $\\mathbf b\\in\\operatorname{Col}A$ ⇔ $\\hat{\\mathbf x}$ is an exact solution.", "id": 82}, {"s": "6.5", "k": "Fact", "f": "Shortcut when the columns of $A$ are orthogonal.", "b": "$\\hat x_j=\\dfrac{\\mathbf b\\cdot\\mathbf a_j}{\\mathbf a_j\\cdot\\mathbf a_j}$ directly, with no normal equations.", "id": 83}, {"s": "6.5", "k": "Trap", "f": "Is $\\hat{\\mathbf x}$ the point of Col A closest to $\\mathbf b$?", "b": "No. That point is $\\hat{\\mathbf b}=A\\hat{\\mathbf x}\\in\\mathbb R^m$. $\\hat{\\mathbf x}\\in\\mathbb R^n$ is the list of <b>weights<\/b> that produces it.", "id": 84}]</script>
<script>
const CARDS = JSON.parse(document.getElementById('cards').textContent);
const KEY = 'm54-flash-review';
let review = new Set();
try { review = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...review])); } catch (e) {} }
let deck = 'all', queue = [], total = 0, doneCount = 0, flipped = false;
const stage = document.getElementById('stage');
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(){
  return CARDS.filter(c => deck==='all' ? true : deck==='review' ? review.has(c.id) : c.s[0]===deck);
}
function start(){
  queue = shuffle(pick().map(c=>c.id)); total = queue.length; doneCount = 0; render();
}
function typeset(el){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(()=>{}); else setTimeout(()=>typeset(el), 300); }
function render(){
  flipped = false;
  document.getElementById('prog').style.width = total ? (100*doneCount/total)+'%' : '0';
  document.getElementById('count').textContent = total ? `${doneCount} / ${total} done` : '';
  document.getElementById('pile').textContent = `review pile: ${review.size}`;
  if (!queue.length){
    stage.innerHTML = total
      ? `<div class="card done"><h2>Deck finished</h2><p>${review.size ? 'Practice the review pile next.' : 'Nothing left in the review pile.'}</p></div>`
      : `<div class="card done"><h2>Nothing here</h2><p>The review pile is empty. Pick another deck.</p></div>`;
    return;
  }
  const c = CARDS[queue[0]];
  stage.innerHTML = `<div class="card" id="card" tabindex="0" role="button" aria-label="Flip card">
    <p class="tagline">§${c.s} · <span class="k ${c.k}">${c.k}</span></p>
    <div class="front">${c.f}</div>
    <div class="back">${c.b}</div>
    <p class="hint">Tap to flip</p></div>
    <div class="actions"><button id="again">Again</button><button id="got">Got it</button></div>`;
  const card = document.getElementById('card');
  card.onclick = flip;
  document.getElementById('again').onclick = () => answer(false);
  document.getElementById('got').onclick = () => answer(true);
  typeset(stage);
}
function flip(){ const card=document.getElementById('card'); if(!card) return; flipped=!flipped; card.classList.toggle('flipped', flipped); }
function answer(ok){
  if (!queue.length) return;
  const id = queue.shift();
  if (ok){ review.delete(id); doneCount++; }
  else { review.add(id); queue.splice(Math.min(3, queue.length), 0, id); }
  save(); render();
}
document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x===b));
  deck = b.dataset.deck; start();
});
document.getElementById('shuffle').onclick = start;
document.getElementById('reset').onclick = () => { review.clear(); save(); render(); };
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button:not(#card)') && e.key===' ') return;
  if (e.key===' '){ e.preventDefault(); flip(); }
  else if (e.key==='1') answer(false);
  else if (e.key==='2') answer(true);
});
start();
</script>
</body></html>
